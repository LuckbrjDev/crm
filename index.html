<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CRM de Clientes</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
<h1>📇 CRM de Clientes</h1>


<form id="formCliente">
<input type="text" id="tecnico" placeholder="Nome do técnico" required />
<input type="text" id="empresa" placeholder="Nome / Razão Social" required />
<input type="email" id="email" placeholder="E-mail do cliente" required />
<input type="text" id="telefone" placeholder="Telefone" required />
<button type="submit">Salvar Cliente</button>
</form>


<ul id="listaClientes"></ul>
</div>


<script src="script.js"></script>
</body>
</html>
