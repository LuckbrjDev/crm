<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM de Clientes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>CRM de Clientes</h1>
</header>

<main class="dashboard">

  <section class="card cadastro">
    <h2>Cadastrar Cliente</h2>
    <form id="formCliente">
      <input id="tecnico" placeholder="Nome do técnico" required>
      <input id="cliente" placeholder="Nome / Razão Social" required>
      <input id="email" type="email" placeholder="E-mail do cliente" required>
      <input id="telefone" placeholder="Telefone do cliente" required>
      <button type="submit">Salvar Cliente</button>
    </form>
  </section>

  <section class="card clientes">
    <div class="clientes-topo">
      <h2>Clientes</h2>
    </div>

    <div class="avaliacoes-inline">
      <div class="star"><span>⭐1</span><input type="number" id="star1" min="0"></div>
      <div class="star"><span>⭐2</span><input type="number" id="star2" min="0"></div>
      <div class="star"><span>⭐3</span><input type="number" id="star3" min="0"></div>
      <div class="star"><span>⭐4</span><input type="number" id="star4" min="0"></div>
      <div class="star"><span>⭐5</span><input type="number" id="star5" min="0"></div>

      <div class="avaliacoes-info">
        <span>Média: <strong id="media">0.00</strong></span>
        <span>Total: <strong id="totalAvaliacoes">0</strong></span>
        <span id="faltam"></span>
      </div>
    </div>

    <ul id="listaClientes"></ul>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
