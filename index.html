<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>CRM Simples</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>CRM de Clientes</h1>

    <section id="avaliacoes">
      <h2>Avaliações</h2>
      <div class="estrelas">
        <div class="linha">
          <span>⭐ 1</span>
          <input type="number" min="0" id="star1" />
        </div>
        <div class="linha">
          <span>⭐⭐ 2</span>
          <input type="number" min="0" id="star2" />
        </div>
        <div class="linha">
          <span>⭐⭐⭐ 3</span>
          <input type="number" min="0" id="star3" />
        </div>
        <div class="linha">
          <span>⭐⭐⭐⭐ 4</span>
          <input type="number" min="0" id="star4" />
        </div>
        <div class="linha">
          <span>⭐⭐⭐⭐⭐ 5</span>
          <input type="number" min="0" id="star5" />
        </div>
      </div>

      <div class="resultado">
        <p>Média: <strong id="media">0.00</strong></p>
        <p>Total de avaliações: <strong id="totalAvaliacoes">0</strong></p>
        <p id="faltam"></p>
      </div>
    </section>
  </header>

  <main>
    <section id="cadastro">
      <h2>Cadastrar Cliente</h2>
      <form id="formCliente">
        <input type="text" id="tecnico" placeholder="Nome do técnico" required />
        <input type="text" id="cliente" placeholder="Nome / Razão Social" required />
        <input type="email" id="email" placeholder="E-mail do cliente" required />
        <input type="text" id="telefone" placeholder="Telefone do cliente" required />
        <button type="submit">Salvar Cliente</button>
      </form>
    </section>

    <section id="lista">
      <h2>Clientes</h2>
      <ul id="listaClientes"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
